# Authors of the posts migrated from https://medium.com/@RobotFramework
#
# Medium carried authorship in prose only ("This is a guest post by …",
# "Yours truly, …") and never in metadata, so every entry below was read out of
# the post text and each social account was verified individually.
#
# Entries without socials are deliberate: no account could be tied to that
# person with enough confidence to publish it. Guessing would misattribute a
# real, named person, so those fields stay empty until someone confirms them.

